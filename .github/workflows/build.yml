name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build
        shell: pwsh
        run: dotnet build "Plain Craft Launcher 2\Plain Craft Launcher 2.csproj" -c Release -o dist --nologo

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PKL-Release
          path: dist
          if-no-files-found: error
